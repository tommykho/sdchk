name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build SdChk.sln -c Release
      - run: dotnet test SdChk.sln -c Release --no-build
      - if: matrix.os == 'ubuntu-latest'
        run: dotnet format SdChk.sln --verify-no-changes
