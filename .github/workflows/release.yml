name: Release

# Push a tag such as v0.1.0 to build the Windows exe, smoke-test it on the runner and publish a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test SdChk.sln -c Release

      - name: Publish self-contained single-file exe
        run: >
          dotnet publish src/SdChk.Cli -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -o out

      - name: Smoke test the exe on Windows (simulated cards, no real drive)
        shell: pwsh
        run: |
          .\out\sdchk.exe simulate
          .\out\sdchk.exe check --simulate wrap-16-of-512 --class U3 --out smoke-fake
          if ($LASTEXITCODE -ne 2) { throw "Expected FAIL (exit 2) for the wrap-around fake, got $LASTEXITCODE" }
          .\out\sdchk.exe check --simulate genuine --class U3 --out smoke-genuine
          if ($LASTEXITCODE -ne 0) { throw "Expected PASS (exit 0) for the genuine card, got $LASTEXITCODE" }
          $p = Start-Process -FilePath .\out\sdchk.exe -ArgumentList 'ui','--no-open','--port','5199' -RedirectStandardOutput ui.out -PassThru
          $url = $null
          for ($i = 0; $i -lt 30 -and -not $url; $i++) {
            Start-Sleep -Seconds 1
            if (Test-Path ui.out) { $m = Select-String -Path ui.out -Pattern 'http://\S+' -List; if ($m) { $url = $m.Matches[0].Value } }
          }
          if (-not $url) { Stop-Process -Id $p.Id -Force; throw 'The UI did not start.' }
          $page = Invoke-WebRequest -Uri $url -UseBasicParsing
          Stop-Process -Id $p.Id -Force
          if ($page.StatusCode -ne 200 -or $page.Content -notmatch 'sdchk card map') { throw 'UI page check failed.' }

      - name: Package
        shell: pwsh
        run: |
          $name = "sdchk-$($env:GITHUB_REF_NAME)-win-x64"
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item out\sdchk.exe, README.md, LICENSE $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower() + "  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $notes = "docs/release-notes/$tag.md"
          if (-not (Test-Path $notes)) { $notes = $null }
          $args = @('release', 'create', $tag, "sdchk-$tag-win-x64.zip", "sdchk-$tag-win-x64.zip.sha256", '--title', "sdchk $tag", '--prerelease')
          if ($notes) { $args += @('--notes-file', $notes) } else { $args += '--generate-notes' }
          & gh @args
